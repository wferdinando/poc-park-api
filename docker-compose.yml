version: '3.8'

services:
  mysql:
    image: mysql:9.7
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: poc-park-api-db
      MYSQL_USER: wferdinando
      MYSQL_PASSWORD: 101189
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
